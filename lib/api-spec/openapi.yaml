openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CEPS Portal API — referral intake, authorizations, invoices, payments, remittances, vendors, reporting
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: clients
  - name: referrals
  - name: signature
  - name: authorizations
  - name: invoices
  - name: payments
  - name: remittances
  - name: vendors
  - name: dashboard
  - name: audit
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email/password login (staff, coordinators, vendors)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current session user
      responses:
        "200":
          description: Session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401": { description: Not authenticated }
  /auth/magic-link/request:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic sign-in link (parents/guardians, self, vendors)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequestInput"
      responses:
        "200":
          description: Link sent (or dev link returned in development)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResult"
  /auth/magic-link/consume:
    post:
      operationId: consumeMagicLink
      tags: [auth]
      summary: Consume a magic link token and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkConsumeInput"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400": { description: Invalid or expired token }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (staff only)
      parameters:
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create/invite a user (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: Per-user audit history (staff only)
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients (scoped by role)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [clients]
      summary: Create client (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Client detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404": { description: Not found }
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client (staff; incl. coordinator reassignment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}/case:
    get:
      operationId: getClientCase
      tags: [clients]
      summary: Full case view — referrals, authorizations, invoices, payments, remittances
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Case bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCase"
  /referrals:
    get:
      operationId: listReferrals
      tags: [referrals]
      summary: List referrals (filterable, scoped by role)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: coordinatorId
          in: query
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Referrals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Referral" }
    post:
      operationId: createReferral
      tags: [referrals]
      summary: Submit referral (coordinator portal form or staff manual entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
  /referrals/{id}:
    get:
      operationId: getReferral
      tags: [referrals]
      summary: Referral detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Referral
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
        "404": { description: Not found }
    patch:
      operationId: updateReferral
      tags: [referrals]
      summary: Update referral (status, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
  /referrals/{id}/send-magic-link:
    post:
      operationId: sendReferralMagicLink
      tags: [referrals]
      summary: (Re)send the parent/guardian e-signature magic link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResult"
  /signature/{token}:
    get:
      operationId: getSignaturePage
      tags: [signature]
      summary: Load agreement data for a magic-link token (no session required)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agreement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignaturePage"
        "400": { description: Invalid or expired token }
    post:
      operationId: submitSignature
      tags: [signature]
      summary: Submit typed-name e-signature
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureInput"
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400": { description: Invalid or expired token }
  /authorizations:
    get:
      operationId: listAuthorizations
      tags: [authorizations]
      summary: List authorizations (filterable, scoped by role)
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: expiringWithinDays
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Authorizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Authorization" }
    post:
      operationId: createAuthorization
      tags: [authorizations]
      summary: Create authorization after staff review of parsed/manual data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationInput"
      responses:
        "201":
          description: Created (response includes any warnings, e.g. max-amount)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResult"
  /authorizations/{id}:
    get:
      operationId: getAuthorization
      tags: [authorizations]
      summary: Authorization detail with utilization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "404": { description: Not found }
    patch:
      operationId: updateAuthorization
      tags: [authorizations]
      summary: Update authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResult"
  /authorizations/parse-pdf:
    post:
      operationId: parseAuthorizationPdf
      tags: [authorizations]
      summary: AI-assisted extraction of fields from an Alta POS PDF (draft only — staff must review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPdfInput"
      responses:
        "200":
          description: Parsed draft fields (never auto-committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosParseResult"
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices (filterable, scoped by role)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Submit invoice (vendor portal, parent, or staff entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Invoice detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404": { description: Not found }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice (link authorization, approve/reject, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}/validate:
    post:
      operationId: validateInvoice
      tags: [invoices]
      summary: Run the five validation checks against the linked authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceValidationInput"
      responses:
        "200":
          description: Validation outcome (invoice status updated when passed or overridden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceValidationResult"
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments (filterable, scoped by role)
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: authorizationId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      operationId: createPayment
      tags: [payments]
      summary: Manually log a payment/check (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created (auto-generates a Fee record when the placeholder rule applies)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/import:
    post:
      operationId: importCheckRegister
      tags: [payments]
      summary: Upload parsed check-register rows; matches to clients/vendors/invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRegisterImportInput"
      responses:
        "200":
          description: Import outcome per row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRegisterImportResult"
  /remittances:
    get:
      operationId: listRemittances
      tags: [remittances]
      summary: List remittances (staff)
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Remittances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Remittance" }
    post:
      operationId: createRemittance
      tags: [remittances]
      summary: Log a remittance line from an Alta Payment Detail Report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemittanceInput"
      responses:
        "201":
          description: Created (auto-matched to a payment when possible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remittance"
  /remittances/{id}/match:
    post:
      operationId: matchRemittance
      tags: [remittances]
      summary: Manually match a remittance line to a payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemittanceMatchInput"
      responses:
        "200":
          description: Matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remittance"
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors (preferred first)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: w9Status
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Vendors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vendor" }
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Add vendor (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Vendor detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404": { description: Not found }
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update vendor (W-9 status, preferred flag, profile)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Program-level overview — status counts, alerts, recent activity
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /reports/vendor-payments:
    get:
      operationId: getVendorPaymentReport
      tags: [dashboard]
      summary: Per-vendor payment totals (YTD; feeds Phase 2 1099s)
      parameters:
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Vendor totals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VendorPaymentSummary" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkResult:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    SessionUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        linkedRecordId: { type: ["string", "null"] }
        linkedRecordType: { type: ["string", "null"], enum: [client, vendor, null] }
    MagicLinkRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
    MagicLinkConsumeInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
    MagicLinkResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
        devLink: { type: ["string", "null"], description: "Development only: the link that would have been emailed" }
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        linkedRecordId: { type: ["string", "null"] }
        linkedRecordType: { type: ["string", "null"], enum: [client, vendor, null] }
        active: { type: boolean }
        lastLogin: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        password: { type: string, description: "Initial password for staff/coordinator accounts" }
        linkedRecordId: { type: string }
        linkedRecordType: { type: string, enum: [client, vendor] }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        active: { type: boolean }
        password: { type: string }
    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string }
        userId: { type: ["string", "null"] }
        userName: { type: ["string", "null"] }
        action: { type: string }
        entityType: { type: ["string", "null"] }
        entityId: { type: ["string", "null"] }
        detail: { type: ["string", "null"] }
        createdAt: { type: string }
    Client:
      type: object
      required: [id, firstName, lastName, dateOfBirth, uciNumber, status]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string }
        uciNumber: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive, closed] }
        regionalCenter: { type: ["string", "null"] }
        preferredLanguage: { type: ["string", "null"] }
        assignedCoordinatorId: { type: ["string", "null"] }
        assignedCoordinatorName: { type: ["string", "null"] }
        isMinor: { type: ["boolean", "null"] }
        familyRepName: { type: ["string", "null"] }
        familyRepPhone: { type: ["string", "null"] }
        familyRepEmail: { type: ["string", "null"] }
        familyRepAddress: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    ClientInput:
      type: object
