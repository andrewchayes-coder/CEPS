    SignatureInput:
      type: object
      required: [typedName, agreed, signerRelationship]
      description: >-
        Typed-name e-signature payload. When createAccount is true a portal
        account is created for the signer and password becomes required and must
        be at least 8 characters. If createAccount is true but password is
        missing or shorter than 8 characters the request is rejected with 400
        and the signature is NOT recorded (the token stays valid). Because this
        is a conditional requirement OpenAPI cannot express fully, the rule is
        enforced by a zod refinement in the handler.
      properties:
        typedName: { type: string, minLength: 1 }
        agreed: { type: boolean }
        signerRelationship:
          type: string
          enum: [self, parent, guardian, conservator]
          description: Relationship of the person signing; recorded when supplied by the agreement form.
        createAccount: { type: boolean, description: "Opt in to creating a portal account for the signer" }
        password: { type: string, minLength: 8, description: "Portal account password (required and >= 8 chars when createAccount is true)" }
    SignatureResult:
      type: object
      required: [ok, accountCreated]
      properties:
        ok: { type: boolean }
        accountCreated:
          type: boolean
          description: >-
            True when a portal account was created for the signer. False when no
            account was requested, or when account creation was skipped because a
            user with this email already exists. The signature itself is always
            recorded when ok is true.
        accountCreationError:
          type: ["string", "null"]
          description: "Human-readable reason account creation was skipped, or null."
