          application/json:
            schema:
              $ref: "#/components/schemas/VendorContactInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "403": { description: Forbidden }
        "404": { description: Not found }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
