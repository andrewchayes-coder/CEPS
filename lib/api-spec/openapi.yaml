openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CEPS Portal API — referral intake, authorizations, invoices, payments, remittances, vendors, reporting
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: clients
  - name: referrals
  - name: signature
  - name: authorizations
  - name: invoices
  - name: payments
  - name: fees
  - name: remittances
  - name: vendors
  - name: dashboard
  - name: audit
  - name: import
  - name: Storage
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Email/password login (staff, coordinators, vendors)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current session user
      responses:
        "200":
          description: Session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401": { description: Not authenticated }
  /auth/magic-link/request:
    post:
      operationId: requestMagicLink
      tags: [auth]
      summary: Request a magic sign-in link (parents/guardians, self, vendors)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequestInput"
      responses:
        "200":
          description: Link sent (or dev link returned in development)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResult"
  /auth/magic-link/consume:
    post:
      operationId: consumeMagicLink
      tags: [auth]
      summary: Consume a magic link token and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkConsumeInput"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400": { description: Invalid or expired token }
  /invites:
    post:
      operationId: createInvite
      tags: [auth]
      summary: Create a portal invite (staff only) — vendor / parent-guardian / self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created; URL returned for staff to share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResult"
        "400": { description: Invalid request or linked record not found }
        "409": { description: A user with that email already exists }
  /invites/{token}:
    get:
      operationId: getInvite
      tags: [auth]
      summary: Look up an invite by token (public, no session required)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        "404": { description: Invalid or expired invite }
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Accept an invite, set a password, and create a session (public)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptInput"
      responses:
        "200":
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400": { description: Invalid request }
        "404": { description: Invalid or expired invite }
        "409": { description: A user with that email already exists }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (staff only)
      parameters:
        - name: role
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create/invite a user (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Deactivate a user (staff; cannot delete yourself)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400": { description: Cannot delete yourself }
        "404": { description: Not found }
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: Per-user audit history (staff only)
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, total]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  total: { type: integer }
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients (scoped by role)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
                  total: { type: integer }
    post:
      operationId: createClient
      tags: [clients]
      summary: Create client (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Client detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404": { description: Not found }
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client (staff; incl. coordinator reassignment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Soft-delete a client (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404": { description: Not found }
  /clients/{id}/case:
    get:
      operationId: getClientCase
      tags: [clients]
      summary: Full case view — referrals, authorizations, invoices, payments, remittances
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Case bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCase"
  /referrals:
    get:
      operationId: listReferrals
      tags: [referrals]
      summary: List referrals (filterable, scoped by role)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: coordinatorId
          in: query
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Referrals
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Referral" }
                  total: { type: integer }
    post:
      operationId: createReferral
      tags: [referrals]
      summary: Submit referral (coordinator portal form or staff manual entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
  /referrals/{id}:
    get:
      operationId: getReferral
      tags: [referrals]
      summary: Referral detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Referral
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
        "404": { description: Not found }
    patch:
      operationId: updateReferral
      tags: [referrals]
      summary: Update referral (status, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
    delete:
      operationId: deleteReferral
      tags: [referrals]
      summary: Delete a referral (staff; blocked if converted to a client)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404": { description: Not found }
        "409": { description: Cannot delete a converted referral }
  /referrals/{id}/send-magic-link:
    post:
      operationId: sendReferralMagicLink
      tags: [referrals]
      summary: (Re)send the parent/guardian e-signature magic link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkResult"
  /signature/{token}:
    get:
      operationId: getSignaturePage
      tags: [signature]
      summary: Load agreement data for a magic-link token (no session required)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agreement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignaturePage"
        "400": { description: Invalid or expired token }
    post:
      operationId: submitSignature
      tags: [signature]
      summary: Submit typed-name e-signature
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureInput"
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400": { description: Invalid or expired token }
  /authorizations:
    get:
      operationId: listAuthorizations
      tags: [authorizations]
      summary: List authorizations (filterable, scoped by role)
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: expiringWithinDays
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Authorizations
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Authorization" }
                  total: { type: integer }
    post:
      operationId: createAuthorization
      tags: [authorizations]
      summary: Create authorization after staff review of parsed/manual data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationInput"
      responses:
        "201":
          description: Created (response includes any warnings, e.g. max-amount)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResult"
  /authorizations/{id}:
    get:
      operationId: getAuthorization
      tags: [authorizations]
      summary: Authorization detail with utilization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorization"
        "404": { description: Not found }
    patch:
      operationId: updateAuthorization
      tags: [authorizations]
      summary: Update authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResult"
    delete:
      operationId: deleteAuthorization
      tags: [authorizations]
      summary: Soft-delete an authorization (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404": { description: Not found }
  /authorizations/parse-pdf:
    post:
      operationId: parseAuthorizationPdf
      tags: [authorizations]
      summary: AI-assisted extraction of fields from an Alta POS PDF (draft only — staff must review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPdfInput"
      responses:
        "200":
          description: Parsed draft fields (never auto-committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosParseResult"
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices (filterable, scoped by role)
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invoice" }
                  total: { type: integer }
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Submit invoice (vendor portal, parent, or staff entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Invoice detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404": { description: Not found }
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update invoice (link authorization, approve/reject, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Soft-delete an invoice (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404": { description: Not found }
  /invoices/{id}/validate:
    post:
      operationId: validateInvoice
      tags: [invoices]
      summary: Run the five validation checks against the linked authorization
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceValidationInput"
      responses:
        "200":
          description: Validation outcome (invoice status updated when passed or overridden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceValidationResult"
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments (filterable, scoped by role)
      parameters:
        - name: clientId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - name: authorizationId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
                  total: { type: integer }
    post:
      operationId: createPayment
      tags: [payments]
      summary: Manually log a payment/check (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created (auto-generates a Fee record when the placeholder rule applies)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "409":
          description: |
            A duplicate payment already exists for this client + authorization +
            service month (hard stop). Resubmit with overrideDuplicate + a written
            overrideJustification to proceed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePaymentError"
  /payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404": { description: Not found }
        "409":
          description: |
            The update would create a duplicate payment for this client +
            authorization + service month (hard stop). Resubmit with
            overrideDuplicate + a written overrideJustification to proceed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePaymentError"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Soft-delete a payment (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404": { description: Not found }
  /payments/import:
    post:
      operationId: importCheckRegister
      tags: [payments]
      summary: Upload parsed check-register rows; matches to clients/vendors/invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRegisterImportInput"
      responses:
        "200":
          description: Import outcome per row
          content:
