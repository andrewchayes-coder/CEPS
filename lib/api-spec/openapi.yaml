  /import/{entity}/template:
    get:
      operationId: getImportTemplate
      tags: [import]
      summary: Download a CSV import template for an entity (generated from the field registry)
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [clients, vendors, authorizations, payments, remittances]
      responses:
        "200":
          description: CSV template (header row with required fields marked, plus an example row)
          content:
            text/csv:
              schema:
                type: string
        "404": { description: Unknown import entity }
  /import/{entity}/validate:
    post:
      operationId: validateImport
      tags: [import]
      summary: Dry-run a CSV import — per-row validation, FK resolution, duplicate preview (no writes)
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [clients, vendors, authorizations, payments, remittances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportValidateInput"
      responses:
        "200":
          description: Per-row validation outcome and preview summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportValidateResult"
        "404": { description: Unknown import entity }
  /import/{entity}/commit:
    post:
      operationId: commitImport
      tags: [import]
      summary: Commit a CSV import — transactional per-row insert, duplicates skipped, audit-logged
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [clients, vendors, authorizations, payments, remittances]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCommitInput"
      responses:
        "200":
          description: Per-row commit outcome (imported / skipped-duplicate / errored counts + detail)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommitResult"
        "404": { description: Unknown import entity }
