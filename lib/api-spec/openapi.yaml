components:
  schemas:
    FamilyRepresentative:
      type: object
      required: [id, clientId, name, relationship, phone, email, address, isPrimary, userId, createdBy, createdAt, hasPortalAccount, portalAccountStatus]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        relationship: { type: string, nullable: true, enum: [parent, guardian, conservator, other] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        isPrimary: { type: boolean }
        userId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        hasPortalAccount: { type: boolean }
        portalAccountStatus: { type: string, enum: [none, invited, active] }
    FamilyRepresentativeInput:
      type: object
      required: [clientId, name]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        relationship: { type: string, nullable: true, enum: [parent, guardian, conservator, other] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        isPrimary: { type: boolean }
    FamilyRepresentativeUpdate:
      type: object
      properties:
        name: { type: string }
        relationship: { type: string, nullable: true, enum: [parent, guardian, conservator, other] }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        isPrimary: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `application/pdf`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkResult:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    SessionUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        linkedRecordId: { type: ["string", "null"] }
        linkedRecordType: { type: ["string", "null"], enum: [client, vendor, null] }
        permissions:
          type: array
          items: { type: string, enum: [invoice_log_validate, invoice_approve, check_writing] }
    UpdateMeInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
      minProperties: 1
    MagicLinkRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
    MagicLinkConsumeInput:
      type: object
      required: [token]
      properties:
        token: { type: string }
    MagicLinkResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
        devLink: { type: ["string", "null"], description: "Development only: the link that would have been emailed" }
    SendIntakeInput:
      type: object
      required: [recipient]
      properties:
        recipient: { type: string, enum: [participant, family_rep] }
        serviceFrequency: { type: ["string", "null"], enum: [one_time, monthly, "", null] }
        cost: { type: ["string", "null"], pattern: '^\d+(\.\d{1,2})?$|^$' }
        paymentSchedule: { type: ["string", "null"] }
        paymentTypeRequested: { type: ["string", "null"], enum: [service_payment, reimbursement, "", null] }
        familyRepresentativeId: { type: ["string", "null"], format: uuid }
    InviteInput:
      type: object
      required: [email, role, linkedRecordType, linkedRecordId]
      properties:
        email: { type: string }
        role:
          type: string
          enum: [vendor, parent_guardian, self]
        linkedRecordType:
          type: string
          enum: [client, vendor]
        linkedRecordId: { type: string }
        familyRepresentativeId: { type: string, format: uuid, nullable: true }
    InviteResult:
      type: object
      required: [inviteUrl]
      properties:
        inviteUrl:
          type: string
          description: "Development only: the invite link for staff to share until email is set up"
    InviteInfo:
      type: object
      required: [email, role, linkedRecordType, recordName]
      properties:
        email: { type: string }
        role:
          type: string
          enum: [vendor, parent_guardian, self]
        linkedRecordType:
          type: string
          enum: [client, vendor]
        recordName: { type: string, description: "Display name of the linked vendor/client" }
    InviteAcceptInput:
      type: object
      required: [password]
      properties:
        name: { type: string }
        password: { type: string, minLength: 8 }
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        linkedRecordId: { type: ["string", "null"] }
        linkedRecordType: { type: ["string", "null"], enum: [client, vendor, null] }
        active: { type: boolean }
        lastLogin: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
        permissions:
          type: array
          items: { type: string, enum: [invoice_log_validate, invoice_approve, check_writing] }
    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        password: { type: string, description: "Initial password for staff/coordinator accounts" }
        linkedRecordId: { type: string }
        linkedRecordType: { type: string, enum: [client, vendor] }
        permissions:
          type: array
          items: { type: string, enum: [invoice_log_validate, invoice_approve, check_writing] }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role:
          type: string
          enum: [staff, service_coordinator, parent_guardian, self, vendor]
        active: { type: boolean }
        password: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [invoice_log_validate, invoice_approve, check_writing] }
    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string }
        userId: { type: ["string", "null"] }
        userName: { type: ["string", "null"] }
        action: { type: string }
        entityType: { type: ["string", "null"] }
        entityId: { type: ["string", "null"] }
        detail: { type: ["string", "null"] }
        createdAt: { type: string }
    Client:
      type: object
      required: [id, firstName, lastName, dateOfBirth, uciNumber, status]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string }
        uciNumber: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive, closed] }
        regionalCenter: { type: ["string", "null"] }
        preferredLanguage: { type: ["string", "null"] }
        assignedCoordinatorId: { type: ["string", "null"] }
        assignedCoordinatorName: { type: ["string", "null"] }
        assignedCoordinatorEmail: { type: ["string", "null"] }
        assignedCoordinatorPhone: { type: ["string", "null"] }
        isMinor: { type: ["boolean", "null"] }
        familyRepName: { type: ["string", "null"] }
        familyRepPhone: { type: ["string", "null"] }
        familyRepEmail: { type: ["string", "null"] }
        familyRepAddress: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    ClientInput:
      type: object
      required: [firstName, lastName, dateOfBirth, uciNumber]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string }
        uciNumber: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, inactive, closed] }
        regionalCenter: { type: string }
        preferredLanguage: { type: string }
        isMinor: { type: boolean }
        familyRepName: { type: string }
        familyRepPhone: { type: string }
        familyRepEmail: { type: string }
        familyRepAddress: { type: string }
    ClientUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string }
        uciNumber: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        status: { type: string, enum: [active, inactive, closed] }
        regionalCenter: { type: string }
        preferredLanguage: { type: string }
        assignedCoordinatorId: { type: ["string", "null"] }
        isMinor: { type: boolean }
        familyRepName: { type: string }
        familyRepPhone: { type: string }
        familyRepEmail: { type: string }
        familyRepAddress: { type: string }
    ClientCase:
      type: object
      required: [client, referrals, authorizations, invoices, payments, remittances, documents]
      properties:
        client: { $ref: "#/components/schemas/Client" }
        referrals:
          type: array
          items: { $ref: "#/components/schemas/Referral" }
        authorizations:
          type: array
          items: { $ref: "#/components/schemas/Authorization" }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        remittances:
          type: array
          items: { $ref: "#/components/schemas/Remittance" }
        documents:
          type: array
          description: Staff-only read-only rollup of documents and tracked document requirements across the participant case.
          items: { $ref: "#/components/schemas/CaseDocument" }
    CaseDocument:
      type: object
      required: [id, name, category, status, recordType, recordId, recordLabel]
      properties:
        id: { type: string }
        name: { type: string }
        category:
          type: string
          enum: [participant_agreement, referral_attachment, authorization_pos, invoice, vendor_w9]
        status:
          type: string
          enum: [pending, sent, received]
        signatureStatus:
          type: ["string", "null"]
          enum: [signed, unsigned, null]
        recordType:
          type: string
          enum: [referral, authorization, invoice, vendor]
        recordId: { type: string }
        recordLabel: { type: string }
        objectPath: { type: ["string", "null"] }
        statusDate: { type: ["string", "null"] }
    ReferralIntakeFields:
      type: object
      description: Structured referral form data (Section 9 field list)
      properties:
        regionalCenterName: { type: string }
        coordinatorName: { type: string }
        coordinatorEmail: { type: string }
        coordinatorPhone: { type: string }
        vendorAcceptsChecks: { type: boolean }
        vendorName: { type: string }
        vendorEmail: { type: string }
