        - name: vendorId
          in: query
          schema: { type: string }
        - name: clientId
          in: query
          schema: { type: string }
        - name: coordinatorId
          in: query
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string }
        - name: endDate
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Vendor totals
          content:
            application/json:
              schema:
                type: array
