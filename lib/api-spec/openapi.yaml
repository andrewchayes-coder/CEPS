          oneOf:
            - $ref: "#/components/schemas/CheckRunPayment"
            - type: "null"
        check:
          oneOf:
            - $ref: "#/components/schemas/CheckRunCheck"
            - type: "null"
        addressMatch: { type: boolean }
    CheckRunPayment:
      type: object
      required: [id, vendorName, address, amount, checkNumber, checkDate]
      properties:
        id: { type: string }
        vendorName: { type: string }
        address: { type: ["string", "null"] }
        amount: { type: string }
        checkNumber: { type: string }
        checkDate: { type: string }
    CheckRunCheck:
      type: object
      required: [rowNumber, vendorName, address, amount, checkNumber, checkDate]
      properties:
        rowNumber: { type: integer }
        vendorName: { type: string }
        address: { type: string }
        amount: { type: string }
        checkNumber: { type: string }
        checkDate: { type: string }
    CheckRunReconciliationResponse:
      type: object
      required: [parsedCount, errorCount, errors, matched, paymentsWithoutChecks, checksWithoutPayments, amountMismatches]
      properties:
        parsedCount: { type: integer }
        errorCount: { type: integer }
        errors: { type: array, items: { type: string } }
        matched: { type: array, items: { $ref: "#/components/schemas/CheckRunReconciliationRow" } }
        paymentsWithoutChecks: { type: array, items: { $ref: "#/components/schemas/CheckRunReconciliationRow" } }
        checksWithoutPayments: { type: array, items: { $ref: "#/components/schemas/CheckRunReconciliationRow" } }
        amountMismatches: { type: array, items: { $ref: "#/components/schemas/CheckRunReconciliationRow" } }
    DuplicatePaymentError:
      type: object
      required: [error, code, existingPayments]
      properties:
        error: { type: string }
        code: { type: string, enum: [duplicate_payment] }
        existingPayments:
          type: array
          description: The payment(s) already on file that block this insert.
          items: { $ref: "#/components/schemas/Payment" }
    AltaFmsPaymentImportInput:
      type: object
      required: [worksheetRows]
      properties:
        worksheetRows:
          type: array
          description: Raw rows from the one-sheet Alta FMS payments workbook.
          items:
            type: array
            items: { type: string }
    AltaFmsPaymentImportRowResult:
      type: object
      required: [rowNumber, outcome]
      properties:
        rowNumber: { type: integer }
        uciNumber: { type: ["string", "null"] }
        outcome: { type: string, enum: [imported, skipped_duplicate, flagged_duplicate, errored] }
        message: { type: ["string", "null"] }
        paymentId: { type: ["string", "null"] }
    AltaFmsPaymentImportResult:
      type: object
      required: [imported, skippedDuplicate, flaggedDuplicate, errored, ignoredNonCheckRows, headerError, parseProblems, results]
      properties:
        imported: { type: integer }
        skippedDuplicate: { type: integer }
        flaggedDuplicate:
          type: integer
          description: Rows held back because another payment already exists for the same participant, authorization, and service month.
        errored: { type: integer }
        ignoredNonCheckRows: { type: integer }
        headerError: { type: ["string", "null"] }
        parseProblems:
          type: array
          items: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/AltaFmsPaymentImportRowResult" }
    ImportValidateInput:
      type: object
      required: [csvText]
      properties:
        csvText:
          type: string
          description: Raw text of the uploaded CSV. Parsed and validated server-side against the entity's field registry.
    ImportRowValidation:
      type: object
      required: [rowNumber, status]
      properties:
        rowNumber: { type: integer }
        status: { type: string, enum: [valid, duplicate, error] }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        message: { type: ["string", "null"] }
    ImportValidateResult:
      type: object
      required: [entity, totalRows, validRows, errorRows, duplicateRows, results]
      properties:
        entity: { type: string, enum: [clients, vendors, authorizations, remittances] }
        headerError:
          type: ["string", "null"]
          description: Set when required columns are missing from the header; no rows validated.
        totalRows: { type: integer }
        validRows: { type: integer }
        errorRows: { type: integer }
        duplicateRows: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/ImportRowValidation" }
    ImportCommitInput:
      type: object
      required: [csvText]
      properties:
        csvText:
          type: string
          description: Raw CSV text. Re-validated server-side before commit; failing rows are skipped and reported.
    ImportCommitRowResult:
      type: object
      required: [rowNumber, status]
      properties:
        rowNumber: { type: integer }
        status: { type: string, enum: [imported, skipped_duplicate, error] }
        id: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        errors:
          type: array
          items: { type: string }
    ImportCommitResult:
      type: object
      required: [entity, imported, skippedDuplicate, errored, results]
      properties:
        entity: { type: string, enum: [clients, vendors, authorizations, remittances] }
        imported: { type: integer }
        skippedDuplicate: { type: integer }
        errored: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/ImportCommitRowResult" }
    Remittance:
      type: object
      required: [id, clientId, remittanceDate, amount, status, source, autoMatched, allocatedAmount, remainingAmount, allocations]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName: { type: ["string", "null"] }
        authorizationId: { type: ["string", "null"] }
        authNumber: { type: ["string", "null"] }
        altaReference: { type: ["string", "null"], description: "Source payment/check reference." }
        remittanceDate: { type: string }
        amount: { type: string }
        paymentMonth: { type: ["string", "null"] }
        status: { type: string, enum: [pending, received, matched] }
        source: { type: string, enum: [alta_regional, manual] }
        matchedPaymentId: { type: ["string", "null"] }
        autoMatched: { type: boolean }
        remittanceBatchId: { type: ["string", "null"] }
        reportReference: { type: ["string", "null"], description: "Source Remittance Report reference, distinct from the generated batch id." }
        reviewReason: { type: ["string", "null"], description: "Stable reason a received remittance requires review." }
        expectedAmount: { type: ["string", "null"], description: "Authorization amount expected for this remittance when known." }
        allocatedAmount: { type: string }
        remainingAmount: { type: string }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/RemittanceAllocation" }
    RemittanceAllocation:
      type: object
      required: [id, paymentId, amount, autoMatched]
      properties:
        id: { type: string }
        paymentId: { type: string }
        amount: { type: string }
        autoMatched: { type: boolean }
        createdAt: { type: ["string", "null"] }
    RemittanceInput:
      type: object
      required: [clientId, authorizationId, remittanceDate, amount]
      properties:
        clientId: { type: string }
        authorizationId: { type: string }
        altaReference: { type: ["string", "null"] }
        remittanceDate: { type: string }
        amount: { type: string }
        paymentMonth: { type: ["string", "null"] }
    RemittanceMatchInput:
      type: object
      required: [paymentId, amount]
      properties:
        paymentId: { type: string }
        amount: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
    AltaRemittanceImportInput:
      type: object
      required: [csvText]
      properties:
        csvText:
          type: string
          description: >-
            Raw text of the uploaded Alta Payment History Detail Report CSV,
            including its summary and detail sections. Parsed server-side.
        reportReference:
          type: string
          description: Optional source Remittance Report reference stamped onto every line.
    AltaRemittanceImportRowResult:
      type: object
      required: [rowNumber, outcome]
      properties:
        rowNumber: { type: integer }
        uciNumber: { type: ["string", "null"] }
        outcome: { type: string, enum: [auto_matched, needs_manual_match, skipped_duplicate, errored] }
        message: { type: ["string", "null"] }
        remittanceId: { type: ["string", "null"] }
        matchedPaymentId: { type: ["string", "null"] }
    AltaRemittanceImportResult:
      type: object
      required: [remittanceBatchId, parsed, imported, errored, autoMatched, needsManualMatch, skippedDuplicate, results]
      properties:
        remittanceBatchId: { type: string }
        parsed: { type: integer, description: "Data rows successfully parsed from the CSV." }
        imported: { type: integer }
        errored: { type: integer }
        autoMatched: { type: integer }
        needsManualMatch: { type: integer }
        skippedDuplicate:
          type: integer
          description: Rows already imported from a prior upload of the same report row (matched by source-row fingerprint) — skipped, not re-inserted.
        headerError:
          type: ["string", "null"]
          description: Set when the required Alta columns could not be located; no rows imported.
        parseProblems:
          type: array
          description: Per-row CSV parse problems (bad/missing required fields) — those rows were skipped before import.
          items: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/AltaRemittanceImportRowResult" }
    Fee:
