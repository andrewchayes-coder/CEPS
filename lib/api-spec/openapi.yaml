          description: Created (auto-generates one $160 Fee per participant/service month)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "409":
          description: |
            A duplicate payment already exists for this client + authorization +
            service month (hard stop). Resubmit with overrideDuplicate + a written
            overrideJustification to proceed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePaymentError"
